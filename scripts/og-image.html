<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(900px 500px at 85% 0%, rgba(196,103,69,0.25), transparent 60%), #173B2E;color:#F5F5EF;font-family:"DM Sans",sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:70px 80px;box-sizing:border-box}
  .brand{display:flex;align-items:center;gap:22px}
  .brand .t{display:flex;flex-direction:column}
  .brand .top{font-size:24px;font-weight:500;color:#BFCFC8}
  .brand .main{font-family:Manrope,sans-serif;font-size:44px;font-weight:800;letter-spacing:.06em;margin-top:2px}
  h1{font-family:Manrope,sans-serif;font-weight:800;font-size:56px;line-height:1.12;margin:0;max-width:980px;letter-spacing:-.02em}
  .creds{display:flex;gap:28px;font-size:22px;color:#C4D9AF}
  .creds span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#C46745;margin-right:10px;vertical-align:middle}
  .url{font-size:24px;color:#BFCFC8;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:flex-end}
</style></head>
<body>
  <div class="brand">
    <svg viewBox="0 0 64 64" width="88" height="88"><rect width="64" height="64" rx="16" fill="#235242"/><rect x="13" y="13" width="12" height="38" rx="2.5" fill="#F5F5EF"/><rect x="39" y="13" width="12" height="38" rx="2.5" fill="#F5F5EF"/><rect x="25" y="31" width="14" height="20" fill="#C46745"/><rect x="25" y="27" width="14" height="4" rx="1" fill="#C4D9AF" opacity="0.9"/></svg>
    <div class="t"><span class="top">Filling the</span><span class="main">GAAP</span></div>
  </div>
  <h1>Accounting and tax that fills the gap between where your finances are and where they should be.</h1>
  <div class="row">
    <div class="creds"><span>Professional Accountant (SA)</span><span>Professional Tax Practitioner (SA)</span><span>Independent Reviewer (SA)</span></div>
    <div class="url">www.ftgaap.co.za</div>
  </div>
</body></html>
