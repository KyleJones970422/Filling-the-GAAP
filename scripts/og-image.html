<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(900px 500px at 85% 0%, rgba(194,153,63,0.28), transparent 60%), #0b2a26;color:#f6f3ec;font-family:Manrope,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:70px 80px;box-sizing:border-box}

  .creds{display:flex;gap:28px;font-size:22px;color:#efe3bf}

  .url{font-size:24px;color:rgba(246,243,236,.7);font-weight:600}

<body>
  <div class="brand">

    <div class="t"><span class="top">Filling the</span><span class="main">GAAP</span></div>
  </div>
  <h1>Accounting and tax that fills the gap between where your finances are and where they should be.</h1>
  <div class="row">
    <div class="creds"><span>Professional Accountant (SA)</span><span>Professional Tax Practitioner (SA)</span><span>Independent Reviewer (SA)</span></div>
    <div class="url">www.ftgaap.co.za</div>
  </div>
